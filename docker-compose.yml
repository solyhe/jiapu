services:
  jiapu:
    build: .
    image: jiapu:latest
    container_name: jiapu
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - AUTH_USER=admin
      - AUTH_PASS=          # 填写后启用登录；留空则不需要密码
      - READ_PUBLIC=0       # 1 = 游客可只读浏览，编辑需登录
      - MAX_BACKUPS=50
      - QUIET=1
    mem_limit: 64m
