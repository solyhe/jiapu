<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>家谱树</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#f7f3ea;--line:#b9b2a2;--ink:#3a3328;--muted:#8d8573;--gold:#b8893a;--panel:#fffdf8;--bd:#e6dfcf;
--m-bg:#dce9f8;--m-bd:#8aaedb;--m-tx:#22467a;--f-bg:#f8dfe9;--f-bd:#dc97b3;--f-tx:#8a2650;--u-bg:#eceae4;--u-bd:#b9b4a8;--u-tx:#555;
--d-bg:#e9e9e9;--d-bd:#bdbdbd;--d-tx:#8a8a8a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#bar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:6px;padding:0 10px;background:rgba(255,253,248,.96);border-bottom:1px solid var(--bd);z-index:10;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.logo{font-weight:700;color:var(--gold);font-size:17px;margin-right:2px;font-family:"STKaiti","KaiTi",serif}
.btn{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;flex:none}
.btn:hover{border-color:var(--gold)}.btn.on{background:#f4e6c8;border-color:var(--gold)}
.btn.danger{color:#c0392b}.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.sep{width:1px;height:22px;background:var(--bd);flex:none;margin:0 2px}
#treeSel{border:1px solid var(--bd);border-radius:6px;padding:3px 6px;background:#fff;max-width:150px;flex:none}
.search{position:relative;flex:none}.search input{width:130px;border:1px solid var(--bd);border-radius:6px;padding:4px 26px 4px 8px;background:#fff}
.search span{position:absolute;right:7px;top:4px;color:var(--muted)}
#status{color:var(--muted);font-size:12px;flex:none;margin:0 4px}#status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4caf50;margin-right:4px}
#status.err i{background:#e53935}#status.busy i{background:#f0a020}
#stage{position:fixed;top:52px;left:0;right:0;bottom:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
svg text{user-select:none}
.card{cursor:pointer}.card:hover rect.c{filter:brightness(.97)}
.plus{cursor:pointer}.plus:hover circle{fill:#e3f1e3}
#panel{position:fixed;top:64px;right:12px;width:310px;max-height:calc(100% - 76px);overflow:auto;background:var(--panel);border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 24px rgba(80,60,20,.12);padding:14px 16px;z-index:9;display:none}
#panel.show{display:block}
#panel h3{margin:0 0 10px;font-size:15px;color:var(--gold);display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--bd);padding-bottom:8px}
#panel h3 b{cursor:pointer;color:var(--muted);font-weight:400;font-size:18px}
#panel label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
#panel input,#panel textarea{width:100%;border:1px solid var(--bd);border-radius:6px;padding:6px 8px;background:#fffefb}
#panel textarea{min-height:64px;resize:vertical}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:6px;padding:5px 0;cursor:pointer}
.seg button.on.m{background:var(--m-bg);border-color:var(--m-bd)}.seg button.on.f{background:var(--f-bg);border-color:var(--f-bd)}
.seg button.on.u,.seg button.on.a{background:#f4e6c8;border-color:var(--gold)}.seg button.on.d{background:#e6e6e6;border-color:#aaa}
.row2{display:flex;gap:8px}.row2>div{flex:1}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.acts button{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:6px 0;cursor:pointer;color:#476}
.acts button:hover{border-color:#7a9}
.batch{display:flex;gap:6px;margin-top:6px}.batch input{flex:1}.batch button{border:1px solid var(--bd);background:#f4e6c8;border-radius:6px;padding:0 10px;cursor:pointer;flex:none}
.del{width:100%;margin-top:6px;border:1px solid #f0c9c4;background:#fff;color:#c0392b;border-radius:6px;padding:6px;cursor:pointer}
.info{margin-top:12px;padding-top:10px;border-top:1px dashed var(--bd);font-size:12px;color:var(--muted);line-height:1.9}.info b{color:var(--gold);font-weight:600}
.info code{background:#f1ece0;padding:0 4px;border-radius:3px}
#legend{position:fixed;right:12px;bottom:12px;background:rgba(255,253,248,.95);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);z-index:8}
#legend div{display:flex;align-items:center;gap:6px}#legend span{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid}
#zoomInfo{position:fixed;left:12px;bottom:12px;font-size:12px;color:var(--muted);z-index:8}
#empty{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);display:none}
#empty button{margin:6px}
.mask{position:fixed;inset:0;background:rgba(40,30,10,.3);z-index:20;display:flex;align-items:center;justify-content:center}
.dlg{background:var(--panel);border-radius:12px;width:min(520px,92vw);max-height:84vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.dlg h4{margin:0 0 12px;color:var(--gold);font-size:16px;display:flex;justify-content:space-between}.dlg h4 b{cursor:pointer;color:var(--muted);font-weight:400}
.dlg table{width:100%;border-collapse:collapse;font-size:13px}.dlg td,.dlg th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.kpi div{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px;text-align:center}
.kpi b{display:block;font-size:20px;color:var(--gold)}.kpi small{color:var(--muted)}
.bar{height:8px;background:#e8dcc0;border-radius:4px}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#3a3328;color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;z-index:30;display:none}
.ro .edit-only{display:none!important}
@media (max-width:640px){#panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:62%;border-radius:14px 14px 0 0}#legend{display:none}}
@media print{#bar,#panel,#legend,#zoomInfo{display:none}}
</style>
</head>
<body>
<div id="bar">
  <span class="logo">家谱树</span>
  <select id="treeSel" title="切换家谱"></select>
  <button class="btn" data-a="trees" title="新建 / 重命名 / 删除家谱">管理</button>
  <span class="sep"></span>
  <button class="btn" data-a="fit">适应窗口</button>
  <button class="btn" data-a="zin">＋</button>
  <button class="btn" data-a="zout">－</button>
  <button class="btn edit-only" data-a="undo" title="Ctrl+Z">↶ 撤销</button>
  <div class="search"><input id="q" placeholder="搜姓名…" autocomplete="off"><span>⌕</span></div>
  <button class="btn" data-a="stats">统计</button>
  <button class="btn edit-only" data-a="sample">示例</button>
  <button class="btn" data-a="layout" id="layoutBtn" title="切换竖排 / 横排">排版：竖</button>
  <span id="status"><i></i>就绪</span>
  <button class="btn edit-only" data-a="saveFile">存到文件</button>
  <button class="btn edit-only" data-a="openFile">打开</button>
  <button class="btn" data-a="png">导出图片</button>
  <button class="btn" data-a="print">打印</button>
  <button class="btn" data-a="csvOut">导出表格</button>
  <button class="btn edit-only" data-a="csvIn">导入表格</button>
  <button class="btn edit-only" data-a="backup">备份</button>
  <button class="btn edit-only" data-a="restore">恢复</button>
  <button class="btn danger edit-only" data-a="clear">清空</button>
  <button class="btn pri" data-a="login" id="loginBtn" style="display:none">登录编辑</button>
</div>
<div id="stage"><svg id="svg" width="100%" height="100%"><g id="vp"></g></svg></div>
<div id="empty"><p>这个家谱还是空的</p><button class="btn pri edit-only" data-a="first">添加始祖</button><button class="btn edit-only" data-a="sample">载入示例</button></div>
<div id="panel"></div>
<div id="legend">
  <div><span style="background:var(--m-bg);border-color:var(--m-bd)"></span>男 · 在世</div>
  <div><span style="background:var(--f-bg);border-color:var(--f-bd)"></span>女 · 在世</div>
  <div><span style="background:var(--d-bg);border-color:var(--d-bd)"></span>已故</div>
  <div><span style="background:#fff;border:1px dashed #999"></span>配偶（虚线框）</div>
</div>
<div id="zoomInfo"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="csvFile" accept=".csv,text/csv" hidden>
<script>
"use strict";
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NS="http://www.w3.org/2000/svg";
let S={trees:[],tid:null,name:"",version:null,members:[],sel:null,canEdit:true,auth:false,
  vertical:localStorage.getItem("jp_layout")!=="h",view:{x:40,y:40,k:1},hits:[],hitIdx:0,undo:[],pos:{},bounds:null};
let saveTimer=null,saving=false,pendingSave=false;

/* ---------------- API ---------------- */
async function api(method,url,body){
  const r=await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error((d&&d.error)||("HTTP "+r.status)),{status:r.status});
  return d;
}
function toast(t,ms=1800){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",ms)}
function setStatus(t,cls=""){const e=$("#status");e.className=cls;e.innerHTML="<i></i>"+esc(t)}
const hms=()=>new Date().toTimeString().slice(0,8);

async function boot(){
  try{const me=await api("GET","/api/me");S.canEdit=me.canEdit;S.auth=me.auth}catch(e){}
  document.body.classList.toggle("ro",!S.canEdit);
  $("#loginBtn").style.display=S.canEdit?"none":"";
  $("#layoutBtn").textContent="排版："+(S.vertical?"竖":"横");
  await loadTrees(+localStorage.getItem("jp_tid")||null);
}
async function loadTrees(want){
  S.trees=await api("GET","/api/trees");
  const sel=$("#treeSel");sel.innerHTML=S.trees.map(t=>`<option value="${t.id}">${esc(t.name)}（${t.count}人）</option>`).join("");
  const id=S.trees.find(t=>t.id===want)?want:S.trees[0].id;sel.value=id;await openTree(id);
}
async function openTree(id){
  const d=await api("GET","/api/trees/"+id);
  S.tid=id;S.name=d.name;S.version=d.version;S.members=d.members;S.sel=null;S.undo=[];
  localStorage.setItem("jp_tid",id);document.title=d.name+" · 家谱树";
  setStatus("已加载 · "+(d.updated_at||"").slice(11));
  render();fit();closePanel();
}
function scheduleSave(){if(!S.canEdit)return;setStatus("待保存…","busy");clearTimeout(saveTimer);saveTimer=setTimeout(save,500)}
async function save(backupNote){
  if(saving){pendingSave=true;return}
  saving=true;setStatus("保存中…","busy");
  try{
    const r=await api("PUT","/api/trees/"+S.tid,{version:S.version,members:S.members,backup:backupNote||undefined});
    S.version=r.version;setStatus("已保存 · "+hms());
    const t=S.trees.find(t=>t.id===S.tid);if(t&&t.count!==r.count){t.count=r.count;const o=$("#treeSel").selectedOptions[0];if(o)o.textContent=`${t.name}（${r.count}人）`}
  }catch(e){setStatus("保存失败","err");toast(e.message,4000);if(e.status===409&&confirm(e.message+"\n现在重新加载？"))openTree(S.tid)}
  saving=false;if(pendingSave){pendingSave=false;save()}
}

/* ---------------- 数据模型 ---------------- */
const uid=()=>Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6);
const byId=()=>{const m={};for(const x of S.members)m[x.id]=x;return m};
function newMember(o){return Object.assign({id:uid(),name:"",gender:"u",alive:1,birth:"",death:"",zibei:"",origin:"",job:"",bio:"",parent_id:"",spouse_of:"",ord:0},o)}
function snapshot(){S.undo.push(JSON.stringify(S.members));if(S.undo.length>80)S.undo.shift()}
function mutate(fn){if(!S.canEdit)return;snapshot();fn();render();scheduleSave()}
function kids(id,idx){return (idx||index()).kids[id]||[]}
function index(){
  const k={},sp={},ids=new Set(S.members.map(m=>m.id));
  for(const m of S.members){
    if(m.spouse_of&&ids.has(m.spouse_of))(sp[m.spouse_of]=sp[m.spouse_of]||[]).push(m);
    else if(m.parent_id&&ids.has(m.parent_id))(k[m.parent_id]=k[m.parent_id]||[]).push(m);
  }
  const srt=(a,b)=>(a.ord-b.ord)||(parseInt(a.birth)||9999)-(parseInt(b.birth)||9999);
  for(const x in k)k[x].sort(srt);for(const x in sp)sp[x].sort(srt);
  const roots=S.members.filter(m=>!(m.spouse_of&&ids.has(m.spouse_of))&&!(m.parent_id&&ids.has(m.parent_id))).sort(srt);
  const gen={},by={};for(const m of S.members)by[m.id]=m;
  const walk=(m,g,seen)=>{if(seen.has(m.id))return;seen.add(m.id);gen[m.id]=g;(sp[m.id]||[]).forEach(s=>gen[s.id]=g);(k[m.id]||[]).forEach(c=>walk(c,g+1,seen))};
  const seen=new Set();roots.forEach(r=>walk(r,1,seen));
  return {kids:k,sp,roots,gen,by};
}
const CN=["长","次","三","四","五","六","七","八","九","十"];
function rankLabel(m,idx){
  const p=m.parent_id&&idx.by[m.parent_id];if(!p||m.spouse_of)return "";
  const sib=(idx.kids[p.id]||[]).filter(x=>x.gender===m.gender);const i=sib.indexOf(m);
  if(m.gender==="u")return "排行"+((idx.kids[p.id]||[]).indexOf(m)+1);
  return (CN[i]||(i+1))+(m.gender==="m"?"子":"女");
}

/* ---------------- 布局 & 渲染 ---------------- */
function dims(){return S.vertical?{W:68,H:124,G:8,HG:22,V:176}:{W:112,H:52,G:6,HG:18,V:104}}
function layout(idx){
  const {W,H,G,HG,V}=dims(),pos={},sw={},uw=id=>W*(1+(idx.sp[id]||[]).length)+G*(idx.sp[id]||[]).length;
  const measure=(m,seen)=>{if(seen.has(m.id))return 0;seen.add(m.id);const ks=idx.kids[m.id]||[];let t=0;ks.forEach((c,i)=>t+=measure(c,seen)+(i?HG:0));return sw[m.id]=Math.max(uw(m.id),t)};
  const place=(m,x0,y,seen)=>{if(seen.has(m.id))return;seen.add(m.id);
    const w=sw[m.id],u=uw(m.id),ux=x0+(w-u)/2;pos[m.id]={x:ux,y,main:true,u};
    (idx.sp[m.id]||[]).forEach((s,i)=>pos[s.id]={x:ux+(W+G)*(i+1),y,main:false});
    const ks=idx.kids[m.id]||[];let tot=0;ks.forEach((c,i)=>tot+=sw[c.id]+(i?HG:0));let cx=x0+(w-tot)/2;
    ks.forEach(c=>{place(c,cx,y+V,seen);cx+=sw[c.id]+HG})};
  let x=0;const s1=new Set(),s2=new Set();
  idx.roots.forEach(r=>{measure(r,s1);place(r,x,0,s2);x+=sw[r.id]+HG*3});
  return pos;
}
const COL={m:["#dce9f8","#8aaedb","#22467a"],f:["#f8dfe9","#dc97b3","#8a2650"],u:["#eceae4","#b9b4a8","#555555"],d:["#e9e9e9","#bdbdbd","#8a8a8a"]};
function cardColors(m){return +m.alive?COL[m.gender]||COL.u:COL.d}
/* 生成 SVG 字符串；forExport=true 时不含按钮、并内联颜色 */
function buildSVG(idx,pos,forExport){
  const {W,H,V,G}=dims(),out=[],lines=[],hit=new Set(S.hits);
  for(const m of S.members){
    const p=pos[m.id];if(!p||!p.main)continue;const ks=(idx.kids[m.id]||[]).filter(c=>pos[c.id]);
    const sp=idx.sp[m.id]||[];const cx=sp.length?p.x+W+G/2:p.x+W/2;  // 夫妻连线中点
    if(sp.length)lines.push(`M${p.x+W} ${p.y+H/2}h${G}`);
    if(ks.length){const by=p.y+H+(V-H)/2+6,y0=p.y+(sp.length?H/2:H);
      lines.push(`M${cx} ${y0}V${by}`);
      const xs=ks.map(c=>pos[c.id].x+W/2);lines.push(`M${Math.min(cx,...xs)} ${by}H${Math.max(cx,...xs)}`);
      xs.forEach(x=>lines.push(`M${x} ${by}V${by+(V-H)/2-6}`));}
  }
  out.push(`<path d="${lines.join("")}" fill="none" stroke="#b9b2a2" stroke-width="1.3"/>`);
  for(const m of S.members){
    const p=pos[m.id];if(!p)continue;const [bg,bd,tx]=cardColors(m),sel=!forExport&&S.sel===m.id;
    const nm=m.name||"未命名",ch=[...nm];
    let g=`<g class="card" data-id="${m.id}" transform="translate(${p.x},${p.y})">`;
    if(hit.has(m.id)&&!forExport)g+=`<rect x="-5" y="-5" width="${W+10}" height="${H+10}" rx="9" fill="#ffe27a" opacity=".7"/>`;
    g+=`<rect class="c" width="${W}" height="${H}" rx="7" fill="${bg}" stroke="${sel?"#b8893a":bd}" stroke-width="${sel?2.6:1.3}" ${p.main?"":'stroke-dasharray="5 3"'}/>`;
    if(S.vertical){
      const fs=ch.length<=3?26:ch.length===4?22:Math.max(12,Math.floor(96/ch.length));const step=fs*1.12,y0=H/2-(ch.length-1)*step/2;
      ch.forEach((c,i)=>g+=`<text x="${W/2}" y="${y0+i*step}" font-size="${fs}" font-weight="700" fill="${tx}" text-anchor="middle" dominant-baseline="central" font-family="STKaiti,KaiTi,'Noto Serif CJK SC',serif">${esc(c)}</text>`);
    }else{
      const fs=ch.length<=4?18:Math.max(11,Math.floor(80/ch.length));
      g+=`<text x="${W/2}" y="${H/2-(m.birth||m.death?7:0)}" font-size="${fs}" font-weight="700" fill="${tx}" text-anchor="middle" dominant-baseline="central" font-family="STKaiti,KaiTi,'Noto Serif CJK SC',serif">${esc(nm)}</text>`;
      if(m.birth||m.death)g+=`<text x="${W/2}" y="${H-10}" font-size="10" fill="${tx}" opacity=".75" text-anchor="middle">${esc(m.birth||"?")}${+m.alive?"":"–"+esc(m.death||"?")}</text>`;
    }
    if(p.main){const n=m.parent_id&&idx.kids[m.parent_id]?idx.kids[m.parent_id].indexOf(m)+1:0;
      if(n)g+=`<circle cx="${W-6}" cy="6" r="6.5" fill="#c9a24e"/><text x="${W-6}" y="6.5" font-size="9" fill="#fff" text-anchor="middle" dominant-baseline="central">${n}</text>`;}
    else{const t=m.gender==="f"?"妻":m.gender==="m"?"夫":"配";
      g+=`<rect x="${W/2-11}" y="-6" width="22" height="12" rx="6" fill="#c9a24e"/><text x="${W/2}" y="0.5" font-size="9" fill="#fff" text-anchor="middle" dominant-baseline="central">${t}</text>`;}
    g+="</g>";out.push(g);
    if(p.main&&!forExport&&S.canEdit){const cx=(idx.sp[m.id]||[]).length?p.x+W+G/2:p.x+W/2;
      out.push(`<g class="plus" data-add="${m.id}" transform="translate(${cx},${p.y+H+13})"><circle r="7.5" fill="#fff" stroke="#6aa86a" stroke-width="1.2"/><path d="M-4 0H4M0 -4V4" stroke="#4d8f4d" stroke-width="1.4"/><title>添加子女</title></g>`);}
  }
  return out.join("");
}
function render(){
  const idx=index(),pos=layout(idx);S.pos=pos;S.idx=idx;
  const {W,H}=dims();let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const id in pos){const p=pos[id];x1=Math.min(x1,p.x);y1=Math.min(y1,p.y);x2=Math.max(x2,p.x+W);y2=Math.max(y2,p.y+H+24)}
  S.bounds=S.members.length?{x:x1,y:y1,w:x2-x1,h:y2-y1}:null;
  $("#vp").innerHTML=buildSVG(idx,pos,false);applyView();
  $("#empty").style.display=S.members.length?"none":"block";
  if(S.sel&&!idx.by[S.sel])closePanel();else if(S.sel)renderPanel();
}
function applyView(){const v=S.view;$("#vp").setAttribute("transform",`translate(${v.x},${v.y}) scale(${v.k})`);$("#zoomInfo").textContent=Math.round(v.k*100)+"%"}
function fit(){
  const b=S.bounds,st=$("#stage").getBoundingClientRect();if(!b){S.view={x:40,y:40,k:1};return applyView()}
  const pr=$("#panel").classList.contains("show")&&innerWidth>640?330:0,aw=st.width-pr-40,ah=st.height-40;
  const k=Math.min(1.4,Math.max(.1,Math.min(aw/b.w,ah/b.h)));

function zoomAt(f,cx,cy){const v=S.view,k=Math.min(4,Math.max(.08,v.k*f));v.x=cx-(cx-v.x)*k/v.k;v.y=cy-(cy-v.y)*k/v.k;v.k=k;applyView()}

  v.x=st.width/2-(p.x+W/2)*v.k-(!mob&&sh?160:0);v.y=(mob&&sh?st.height*.22:st.height/2)-(p.y+H/2)*v.k;applyView()}

(()=>{const st=$("#stage"),pts=new Map();let start=null,moved=false,pinch=null;
  st.addEventListener("pointerdown",e=>{st.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(pts.size===1)start={x:e.clientX,y:e.clientY,vx:S.view.x,vy:S.view.y,t:e.target};
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:S.view.k}}});
  st.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=st.getBoundingClientRect();
      zoomAt(pinch.k*d/pinch.d/S.view.k,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);moved=true;return}
    if(start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>4){moved=true;st.classList.add("drag")}
      if(moved){S.view.x=start.vx+dx;S.view.y=start.vy+dy;applyView()}}});
  const up=e=>{pts.delete(e.pointerId);st.classList.remove("drag");if(pts.size<2)pinch=null;
    if(pts.size===0&&start&&!moved){const t=start.t.closest&&start.t.closest("[data-id],[data-add]");
      if(t&&t.dataset.add)addChild(t.dataset.add);else if(t)select(t.dataset.id);else closePanel()}
    if(pts.size===0)start=null};
  st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
  st.addEventListener("wheel",e=>{e.preventDefault();const r=st.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
})();

function addChild(pid){const p=S.idx.by[pid];const ks=S.idx.kids[pid]||[];

function parseCSV(t){const out=[];let row=[],cur="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===","){row.push(cur);cur=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cur);out.push(row);row=[];cur=""}else cur+=ch}
  if(cur||row.length){row.push(cur);out.push(row)}return out}

  <table><tr><th style="width:70px">世代</th><th>人数</th><th style="width:40px"></th></tr>${Object.keys(gens).sort((a,b)=>a-b).map(g=>`<tr><td>第 ${g} 代</td><td><div class="bar" style="width:${gens[g]/mx*100}%"></div></td><td>${gens[g]}</td></tr>`).join("")}</table>
  ${Object.keys(sur).length?`<p style="color:var(--muted);font-size:13px">本家姓氏：${Object.entries(sur).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+" "+v).join("、")}</p>`:""}
  ${Object.keys(zb).length?`<p style="color:var(--muted);font-size:13px">字辈：${Object.entries(zb).map(([k,v])=>esc(k)+" "+v).join("、")}</p>`:""}`)}
async function showBackups(){let list;try{list=await api("GET",`/api/trees/${S.tid}/backups`)}catch(e){return toast(e.message)}
  const m=dialog("服务器备份 · "+esc(S.name),`<p><button class="btn pri" data-b="new">立即备份</button></p>${list.length?`<table><tr><th>时间</th><th>备注</th><th>人数</th><th></th></tr>${list.map(b=>`<tr><td>${b.created_at}</td><td>${esc(b.note)}</td><td>${b.count}</td><td style="white-space:nowrap"><button class="btn" data-b="r" data-id="${b.id}">恢复</button> <a class="btn" href="/api/backups/${b.id}/download">下载</a> <button class="btn danger" data-b="d" data-id="${b.id}">删</button></td></tr>`).join("")}</table>`:"<p style='color:var(--muted)'>暂无备份</p>"}`);
  m.addEventListener("click",async e=>{const b=e.target.closest("[data-b]");if(!b)return;try{
    if(b.dataset.b==="new"){await A.backup();showBackups()}
    if(b.dataset.b==="r"&&confirm("用此备份覆盖当前家谱？（当前内容会先自动备份）")){clearTimeout(saveTimer);await api("POST",`/api/backups/${b.dataset.id}/restore`);m.remove();await openTree(S.tid);toast("已恢复")}
    if(b.dataset.b==="d"&&confirm("删除此备份？")){await api("DELETE",`/api/backups/${b.dataset.id}`);showBackups()}}catch(err){toast(err.message)}})}
function showTrees(){const m=dialog("家谱管理",`<table>${S.trees.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.count} 人</td><td style="white-space:nowrap;text-align:right">
  <button class="btn" data-t="open" data-id="${t.id}">打开</button> <span class="edit-only"><button class="btn" data-t="ren" data-id="${t.id}">重命名</button> <button class="btn danger" data-t="del" data-id="${t.id}">删除</button></span></td></tr>`).join("")}</table>
  <p class="edit-only"><button class="btn pri" data-t="new">＋ 新建家谱</button></p>`);
  m.addEventListener("click",async e=>{const b=e.target.closest("[data-t]");if(!b)return;const id=+b.dataset.id;try{
    if(b.dataset.t==="open"){m.remove();$("#treeSel").value=id;openTree(id)}
    if(b.dataset.t==="new"){const n=prompt("新家谱名称","某氏家谱");if(!n)return;const r=await api("POST","/api/trees",{name:n});m.remove();await loadTrees(r.id)}
    if(b.dataset.t==="ren"){const t=S.trees.find(t=>t.id===id),n=prompt("新名称",t.name);if(!n)return;await api("PATCH","/api/trees/"+id,{name:n});m.remove();await loadTrees(S.tid)}
    if(b.dataset.t==="del"){const t=S.trees.find(t=>t.id===id);if(prompt(`删除「${t.name}」及其全部成员和备份，不可恢复。\n请输入家谱名称确认：`)!==t.name)return;await api("DELETE","/api/trees/"+id);m.remove();await loadTrees(id===S.tid?null:S.tid)}
  }catch(err){toast(err.message,3000)}})}
